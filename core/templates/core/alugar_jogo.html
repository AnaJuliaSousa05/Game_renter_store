<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Alugar Jogo - {{ jogo.titulo }}</title>
</head>
<body>
    <h1>Alugar {{ jogo.titulo }}</h1>
    <p>Plataforma: {{ jogo.plataforma }}</p>
    <p>Preço da Diária: R$ {{ jogo.preco_diaria }}</p>

    <hr>

    
    <form method="POST">
        {% csrf_token %}
        <label for="dias">Quantidade de dias:</label>
        <input type="number" id="dias" name="dias" value="1" min="1" required>

        <br><br>
        <button type="submit">Confirmar Aluguel</button>
    </form>

    <br>
    <a href="{% url 'home' %}">Cancelar e Voltar</a>
</body>
</html>
