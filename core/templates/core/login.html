<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - Locadora de Jogos</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 80vh; }
        .login-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 350px; border-top: 4px solid #5a2d9c; }
        h2 { color: #5a2d9c; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="password"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background-color: #5a2d9c; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #432075; }
        .error { color: red; margin-bottom: 15px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>🔑 Entrar na Conta</h2>

        #senha incorreta
        {% if form.errors %}
            <p class="error">Usuário ou senha inválidos. Tente novamente.</p>
        {% endif %}

        #login
        <form method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="username">Usuário:</label>
                <input type="text" name="username" id="username" required>
            </div>

            <div class="form-group">
                <label for="password">Senha:</label>
                <input type="password" name="password" id="password" required>
            </div>

            <button type="submit">Entrar</button>
        </form>

        <p style="margin-top: 15px; font-size: 14px; text-align: center;">
            Não tem uma conta? <a href="{% url 'cadastro' %}">Cadastre-se</a>
        </p>
    </div>

</body>
</html>
