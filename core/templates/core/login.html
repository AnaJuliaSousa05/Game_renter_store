<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Locadora de Jogos</title>
    <!-- Fonte Google Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .login-card {
            background: #ffffff;
            padding: 2.5rem 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            border: 1px solid #e2e8f0;
            width: 100%;
            max-width: 400px;
        }

        .header-card {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header-card .icon {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            display: inline-block;
        }

        .header-card h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0f172a;
        }

        .header-card p {
            font-size: 0.875rem;
            color: #64748b;
            margin-top: 0.25rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.875rem;
            color: #334155;
        }

        input[type="text"], 
        input[type="password"] {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            color: #0f172a;
            outline: none;
            transition: all 0.2s ease;
            background-color: #f8fafc;
        }

        input[type="text"]:focus, 
        input[type="password"]:focus {
            background-color: #ffffff;
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        button[type="submit"] {
            width: 100%;
            padding: 0.85rem;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: background-color 0.2s ease;
        }

        button[type="submit"]:hover {
            background-color: #4338ca;
        }

        .error-alert {
            background-color: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .footer-text {
            margin-top: 1.75rem;
            font-size: 0.875rem;
            text-align: center;
            color: #64748b;
        }

        .footer-text a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="header-card">
            <span class="icon">🎮</span>
            <h2>Acesse sua conta</h2>
            <p>Entre com seus dados para alugar jogos</p>
        </div>

        {# Mensagem de erro ao falhar o login #}
        {% if form.errors %}
            <div class="error-alert">
                ⚠️ Usuário ou senha inválidos. Tente novamente.
            </div>
        {% endif %}

        {# Formulário de Login #}
        <form method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="username">Usuário</label>
                <input type="text" name="username" id="username" placeholder="Seu nome de usuário" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" name="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit">Entrar na Conta</button>
        </form>

        <p class="footer-text">
            Não tem uma conta ainda? <a href="{% url 'cadastro' %}">Cadastre-se</a>
        </p>
    </div>

</body>
</html>
